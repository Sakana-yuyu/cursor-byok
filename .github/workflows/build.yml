name: Build desktop artifacts

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            runner: windows-latest
            target: windows
            artifact: windows-amd64
            protoc_asset: protoc-29.3-win64.zip
          - name: Linux amd64
            runner: ubuntu-24.04
            target: linux
            artifact: linux-amd64
            protoc_asset: protoc-29.3-linux-x86_64.zip
          - name: macOS amd64
            runner: macos-15-intel
            target: macos-amd64
            artifact: macos-amd64
            protoc_asset: protoc-29.3-osx-x86_64.zip
          - name: macOS arm64
            runner: macos-15
            target: macos-arm64
            artifact: macos-arm64
            protoc_asset: protoc-29.3-osx-aarch_64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Yarn classic and reset registry
        shell: bash
        run: |
          # CI 环境使用官方 npm registry，避免 npmmirror 镜像缓存损坏。
          # 降低 Yarn 并发，规避 Windows runner 上大包缓存解压的偶发 ENOENT/ENOTEMPTY。
          printf 'registry "https://registry.npmjs.org/"\nnetwork-timeout 300000\nnetwork-concurrency 1\nchild-concurrency 1\n' > frontend/.yarnrc
          # yarn.lock 中残留的 npmmirror resolved URL 会绕过 registry 配置，统一改写
          if [ -f frontend/yarn.lock ]; then
            sed -i.bak 's|registry.npmmirror.com|registry.npmjs.org|g' frontend/yarn.lock || true
            rm -f frontend/yarn.lock.bak
          fi
          # Yarn 缓存可能已存损坏 tarball，指向当前 runner 的临时目录强制重新下载。
          if [ "${RUNNER_OS:-}" != "Windows" ]; then
            echo "YARN_CACHE_FOLDER=${RUNNER_TEMP:-$HOME}/yarn-cache-fresh" >> "$GITHUB_ENV"
          fi
          npm install -g yarn@1.22.22
          NPM_BIN="$(npm config get prefix)"
          if [ -d "$NPM_BIN/bin" ]; then NPM_BIN="$NPM_BIN/bin"; fi
          if [ "${RUNNER_OS:-}" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
            NPM_BIN="$(cygpath -w "$NPM_BIN")"
          fi
          echo "$NPM_BIN" >> "$GITHUB_PATH"
          yarn --version
          yarn config get registry

      - name: Configure Windows Yarn cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheDirectory = Join-Path $env:RUNNER_TEMP 'yarn-cache-fresh'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $cacheDirectory
          New-Item -ItemType Directory -Force -Path $cacheDirectory | Out-Null
          "YARN_CACHE_FOLDER=$cacheDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          yarn config set cache-folder $cacheDirectory
          yarn config get cache-folder

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # wails3 CLI 的 go install 需要 cgo 链接 GTK/WebKit，系统库必须先于 wails3 安装
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install protoc (prebuilt, with well-known types)
        shell: bash
        run: |
          set -e
          PROTOC_VERSION="29.3"
          ASSET="${{ matrix.protoc_asset }}"
          INSTALL_DIR="$HOME/protoc"
          mkdir -p "$INSTALL_DIR"
          URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${ASSET}"
          echo "Downloading $URL"
          curl -fsSL -o "$INSTALL_DIR/protoc.zip" "$URL"
          if command -v unzip >/dev/null 2>&1; then
            (cd "$INSTALL_DIR" && unzip -o protoc.zip >/dev/null)
          else
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$INSTALL_DIR/protoc.zip' -DestinationPath '$INSTALL_DIR' -Force"
          fi
          PROTOC_PATH="$INSTALL_DIR/bin"
          if [ "${RUNNER_OS:-}" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
            PROTOC_PATH="$(cygpath -w "$PROTOC_PATH")"
          fi
          echo "$PROTOC_PATH" >> "$GITHUB_PATH"
          # 验证 well-known types 可被发现（protoc 相对 bin/../include 自动搜索）
          if [ -f "$INSTALL_DIR/include/google/protobuf/struct.proto" ]; then
            echo "well-known types OK: struct.proto present"
          else
            echo "::error::well-known types missing in prebuilt protoc"
            exit 1
          fi
          PROTOC_BIN="$INSTALL_DIR/bin/protoc"
          if [ -f "$INSTALL_DIR/bin/protoc.exe" ]; then PROTOC_BIN="$INSTALL_DIR/bin/protoc.exe"; fi
          "$PROTOC_BIN" --version

      - name: Install protoc Go plugins
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest

      - name: Install Task and Wails
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.44.1
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          task --version
          wails3 version

      - name: Install Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidatePaths = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          )
          $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }

          if (-not $makensis) {
            throw 'NSIS installation completed but makensis.exe was not found'
          }

          $nsisDirectory = Split-Path -Parent $makensis
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Verify Windows build toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          protoc --version
          protoc-gen-go --version
          protoc-gen-connect-go --version
          yarn --version
          task --version
          wails3 version
          where.exe protoc
          where.exe yarn

      - name: Install Windows frontend dependencies
        if: matrix.target == 'windows'
        shell: pwsh
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile --network-concurrency 1 --mutex file
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows amd64 packages
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          task build:windows:amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          task build:windows:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'bin/windows-64.zip')) { throw 'Windows ZIP was not produced' }
          $installer = Get-ChildItem 'bin/*-amd64-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced' }
          Write-Host "Produced $($installer.FullName)"

      - name: Build Linux amd64 package
        if: matrix.target == 'linux'
        shell: bash
        run: |
          task build:linux:amd64
          test -f bin/linux-amd64.tar.gz

      - name: Build macOS package
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          ARCH_NAME="${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'amd64' }}"
          VERSION="$(go run ./scripts/release version -config ./build/config.yml)"
          task "build:darwin:${ARCH_NAME}"
          test -f "bin/${{ endsWith(matrix.target, 'arm64') && 'macos-arm64.dmg' || 'macos-intel.dmg' }}"
          task "release:build:macos:${ARCH_NAME}"
          test -f "bin/release/${VERSION}/cursor-byok-${VERSION}-macos-${ARCH_NAME}.tar.gz"

      - name: Upload Windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            bin/windows-64.zip
            bin/*-amd64-installer.exe

      - name: Upload Linux artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: bin/linux-amd64.tar.gz

      - name: Upload macOS artifact
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            bin/macos-*.dmg
            bin/release/**/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets and update manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          assets = list(Path("release-assets").rglob("*"))
          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          publish = Path("publish")
          wanted = {
              "windows-64.zip": f"cursor-byok-{version}-windows-amd64.zip",
              "linux-amd64.tar.gz": f"cursor-byok-{version}-linux-amd64.tar.gz",
              f"cursor-byok-{version}-macos-arm64.tar.gz": f"cursor-byok-{version}-macos-arm64.tar.gz",
              f"cursor-byok-{version}-macos-amd64.tar.gz": f"cursor-byok-{version}-macos-amd64.tar.gz",
          }
          for source_name, target_name in wanted.items():
              source = next((path for path in assets if path.name == source_name), None)
              if source is None:
                  raise SystemExit(f"missing build asset: {source_name}")
              shutil.copyfile(source, publish / target_name)
          platforms = {}
          for platform, suffix in {
              "macos-arm64": ".tar.gz",
              "macos-amd64": ".tar.gz",
              "windows-amd64": ".zip",
              "linux-amd64": ".tar.gz",
          }.items():
              filename = f"cursor-byok-{version}-{platform}{suffix}"
              path = publish / filename
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              platforms[platform] = {
                  "url": f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{tag}/{filename}",
                  "size": path.stat().st_size,
                  "checksum": f"sha256:{digest}",
              }
          (publish / "update.json").write_text(
              json.dumps({
                  "version": version,
                  "release_date": "",
                  "release_notes": Path("release-notes.md").read_text(encoding="utf-8"),
                  "platforms": platforms,
                  "mandatory": False,
              }, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" publish/* --repo "$GITHUB_REPOSITORY" --clobber
