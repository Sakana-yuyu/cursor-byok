name: Build desktop artifacts

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            runner: windows-latest
            target: windows
            artifact: windows-amd64
            protoc_asset: protoc-29.3-win64.zip
          - name: Linux amd64
            runner: ubuntu-24.04
            target: linux
            artifact: linux-amd64
            protoc_asset: protoc-29.3-linux-x86_64.zip
          - name: macOS amd64
            runner: macos-15-intel
            target: macos-amd64
            artifact: macos-amd64
            protoc_asset: protoc-29.3-osx-x86_64.zip
          - name: macOS arm64
            runner: macos-15
            target: macos-arm64
            artifact: macos-arm64
            protoc_asset: protoc-29.3-osx-aarch_64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Yarn classic and reset registry
        shell: bash
        run: |
          # CI 环境使用官方 npm registry，避免 npmmirror 镜像缓存损坏
          printf 'registry "https://registry.npmjs.org/"\nnetwork-timeout 300000\n' > frontend/.yarnrc
          # yarn.lock 中残留的 npmmirror resolved URL 会绕过 registry 配置，统一改写
          if [ -f frontend/yarn.lock ]; then
            sed -i.bak 's|registry.npmmirror.com|registry.npmjs.org|g' frontend/yarn.lock || true
            rm -f frontend/yarn.lock.bak
          fi
          # Yarn 缓存可能已存损坏 tarball，指向全新缓存目录强制重新下载
          echo "YARN_CACHE_FOLDER=$HOME/.yarn-cache-fresh" >> "$GITHUB_ENV"
          npm install -g yarn@1.22.22
          NPM_BIN="$(npm config get prefix)"
          if [ -d "$NPM_BIN/bin" ]; then NPM_BIN="$NPM_BIN/bin"; fi
          if [ "${RUNNER_OS:-}" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
            NPM_BIN="$(cygpath -w "$NPM_BIN")"
          fi
          echo "$NPM_BIN" >> "$GITHUB_PATH"
          yarn --version
          yarn config get registry

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # wails3 CLI 的 go install 需要 cgo 链接 GTK/WebKit，系统库必须先于 wails3 安装
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install protoc (prebuilt, with well-known types)
        shell: bash
        run: |
          set -e
          PROTOC_VERSION="29.3"
          ASSET="${{ matrix.protoc_asset }}"
          INSTALL_DIR="$HOME/protoc"
          mkdir -p "$INSTALL_DIR"
          URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${ASSET}"
          echo "Downloading $URL"
          curl -fsSL -o "$INSTALL_DIR/protoc.zip" "$URL"
          if command -v unzip >/dev/null 2>&1; then
            (cd "$INSTALL_DIR" && unzip -o protoc.zip >/dev/null)
          else
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$INSTALL_DIR/protoc.zip' -DestinationPath '$INSTALL_DIR' -Force"
          fi
          PROTOC_PATH="$INSTALL_DIR/bin"
          if [ "${RUNNER_OS:-}" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
            PROTOC_PATH="$(cygpath -w "$PROTOC_PATH")"
          fi
          echo "$PROTOC_PATH" >> "$GITHUB_PATH"
          # 验证 well-known types 可被发现（protoc 相对 bin/../include 自动搜索）
          if [ -f "$INSTALL_DIR/include/google/protobuf/struct.proto" ]; then
            echo "well-known types OK: struct.proto present"
          else
            echo "::error::well-known types missing in prebuilt protoc"
            exit 1
          fi
          PROTOC_BIN="$INSTALL_DIR/bin/protoc"
          if [ -f "$INSTALL_DIR/bin/protoc.exe" ]; then PROTOC_BIN="$INSTALL_DIR/bin/protoc.exe"; fi
          "$PROTOC_BIN" --version

      - name: Install protoc Go plugins
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest

      - name: Install Task and Wails
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.44.1
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          task --version
          wails3 version

      - name: Install Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidatePaths = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          )
          $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }

          if (-not $makensis) {
            throw 'NSIS installation completed but makensis.exe was not found'
          }

          $nsisDirectory = Split-Path -Parent $makensis
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Verify Windows build toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          protoc --version
          protoc-gen-go --version
          protoc-gen-connect-go --version
          yarn --version
          task --version
          wails3 version
          where.exe protoc
          where.exe yarn

      - name: Build Windows amd64 packages
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          task build:windows:amd64
          task build:windows:installer
          if (-not (Test-Path 'bin/windows-64.zip')) { throw 'Windows ZIP was not produced' }
          $installer = Get-ChildItem 'bin/*-amd64-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced' }
          Write-Host "Produced $($installer.FullName)"

      - name: Build Linux amd64 package
        if: matrix.target == 'linux'
        shell: bash
        run: |
          task build:linux:amd64
          test -f bin/linux-amd64.tar.gz

      - name: Build macOS package
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          task "build:darwin:${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'amd64' }}"
          test -f "bin/${{ endsWith(matrix.target, 'arm64') && 'macos-arm64.dmg' || 'macos-intel.dmg' }}"

      - name: Upload Windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            bin/windows-64.zip
            bin/*-amd64-installer.exe

      - name: Upload Linux artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: bin/linux-amd64.tar.gz

      - name: Upload macOS artifact
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ endsWith(matrix.target, 'arm64') && 'bin/macos-arm64.dmg' || 'bin/macos-intel.dmg' }}