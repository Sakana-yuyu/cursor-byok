name: Frontend verification

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # 这里刻意不跑 `yarn build`。生产构建需要 frontend/bindings/（gitignore 的生成产物），
  # 只有 `wails3 generate bindings` 能产出，而 wails3 CLI 在 Linux 上要先 apt 装
  # GTK/WebKit 开发包才能 go install——那正是 build.yml 里的完整链路。build.yml 与本
  # 工作流的触发条件相同（push '**' + pull_request），它的 task build:linux:amd64
  # 已经跑过同一条 `yarn build`（含 assert-build-output.mjs 门禁）且长期是绿的，
  # 所以在这里重复一遍只会多花两三分钟、拿不到新信号。lint 与 E2E 才是 build.yml
  # 没有覆盖的部分。
  frontend:
    name: Frontend lint / e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Yarn classic and reset registry
        shell: bash
        run: |
          printf 'registry "https://registry.npmjs.org/"\nnetwork-timeout 300000\n' > frontend/.yarnrc
          if [ -f frontend/yarn.lock ]; then
            sed -i 's|registry.npmmirror.com|registry.npmjs.org|g' frontend/yarn.lock || true
          fi
          npm install -g yarn@1.22.22

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: yarn lint

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # E2E 跑在 browser-preview 模式的 Vite dev server 上（playwright.config.mjs 的
      # webServer），绑定层与 @wailsio/runtime 都走内存 mock，不需要 frontend/bindings、
      # frontend/dist，也不需要真实桌面环境。
      - name: Run button-level E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=line

      # 这条 E2E 此前从未在 CI 上真正执行过（yarn build 先失败了），首次跑起来后留一份
      # trace/截图，避免只看到一行 "1 failed"。
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report
            frontend/test-results

  go:
    name: Go build / vet / test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gen/ 是 gitignore 的生成产物，干净检出里不存在，而仓库大量导入 cursor/gen/...，
      # 所以编译前必须先生成。protoc 版本与 build.yml 保持一致。
      - name: Install protoc
        run: |
          set -e
          PROTOC_VERSION="29.3"
          INSTALL_DIR="$HOME/protoc"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o "$INSTALL_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -o "$INSTALL_DIR/protoc.zip" -d "$INSTALL_DIR" > /dev/null
          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"

      # 插件版本钉到 go.mod 里的模块版本，避免 @latest 让生成产物随上游漂移。
      - name: Install protoc Go plugins
        run: |
          set -e
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1

      - name: Generate protobuf code
        run: |
          set -e
          protoc --version
          protoc-gen-go --version
          protoc-gen-connect-go --version
          go run ./proto/apply_tool -from ./proto/from_extensions -to ./proto
          protoc -I ./proto \
            --go_out=. --go_opt=module=cursor \
            --connect-go_out=. --connect-go_opt=module=cursor \
            ./proto/agent_v1.proto ./proto/aiserver_v1.proto

      # apply_tool 是幂等的，所以这里出现 diff 只可能是有人直接改了编译输入
      # proto/*.proto 而没有改抽取产物 proto/from_extensions/*.proto——那份改动
      # 会在下一次同步时被静默覆盖。
      - name: Compiled proto matches extraction output
        run: git diff --exit-code -- proto/agent_v1.proto proto/aiserver_v1.proto

      # main.go 的 //go:embed all:frontend/dist 同样指向 gitignore 的构建产物。真实产物
      # 要先生成 wails 绑定再 yarn build（见 frontend job 顶部说明），代价与 build.yml
      # 重复；而本 job 只做编译检查与跑测试，链接出的二进制不会被分发，所以放占位文件。
      # 安全前提：没有任何 Go 代码或测试读 frontend/dist 的真实内容——根包没有测试文件，
      # assets 只是作为参数传进 app.Run。
      # 注意空目录不行：go:embed 会报 "contains no embeddable files"，目录里至少要有一个
      # 可嵌入文件。
      - name: Stub embedded frontend assets
        run: |
          set -e
          if [ -n "$(find frontend/dist -type f 2>/dev/null | head -n 1)" ]; then
            echo "frontend/dist already has content, leaving it untouched"
          else
            mkdir -p frontend/dist
            printf '<!doctype html><title>ci build stub</title>\n' > frontend/dist/index.html
            echo "created frontend/dist/index.html stub for go:embed"
          fi

      # internal/app 经 wails v3 拉进 assetserver/webview，那是一组 cgo 包，在 Linux 上要
      # 靠 pkg-config 找到 gtk+-3.0 / webkit2gtk-4.1 / gio-unix-2.0 / libsoup-3.0，
      # ubuntu-24.04 runner 默认没有这些开发头文件，go build ./... 会直接停在 pkg-config。
      # 包清单与安装方式照搬 build.yml 的 Install Linux build dependencies——那个 job 用同
      # 一组包成功编译并链接了真实的 Linux 二进制，libsoup-3.0 与 gio-unix-2.0 分别由
      # libwebkit2gtk-4.1-dev 和 libgtk-3-dev 间接带入，不必单列。
      - name: Install Linux build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # 全量 go test -race 在 runner 上约 15min+ 且易超时；forwarder 是并发最重的包
      # （文件锁、checkpoint debounce、run queue），优先在这里做竞态检测。
      - name: Race (forwarder)
        run: go test -race ./internal/backend/forwarder/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        continue-on-error: true
        run: govulncheck ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      # 首版仅启用 govet（与 go vet 等价），后续可逐步打开 staticcheck / errcheck。
      - name: Lint (golangci-lint)
        run: golangci-lint run ./...

      - name: Reject tracked secrets in cursor-tab-server config
        run: |
          set -e
          if git ls-files --error-unmatch cursor-tab-server/config.yaml >/dev/null 2>&1; then
            echo "cursor-tab-server/config.yaml must not be tracked; use config.yaml.example"
            exit 1
          fi
          if [ -f cursor-tab-server/config.yaml ] && grep -qE 'token:\s*".{20,}"' cursor-tab-server/config.yaml; then
            echo "cursor-tab-server/config.yaml looks like it contains a real token"
            exit 1
          fi

      # 能力清单由 tool_catalog.go 生成。此前多次出现改了 catalog 却没重跑生成器，
      # 漂移一路累积到下一个改动者身上。
      - name: Capability map is in sync with tool catalog
        run: |
          set -e
          go run ./cmd/sync-tool-catalog --write
          git diff --exit-code -- docs/cursor-capability-map.md

      - name: Bundled skills match .agents/skills
        run: go run ./cmd/sync-bundled-skills --check
